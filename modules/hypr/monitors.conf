# Address monitors by their persistent description (serial), NOT by connector
# name (DP-4/DP-5). Both panels are identical Dell P2421DC units, and the GPU
# can enumerate them onto either DisplayPort across reboots/replugs — which
# swaps left/right when keyed by connector. The serial is stable per panel.
#
# Left / main monitor  -> serial J1VVS03 at 0x0
# Right monitor        -> serial 9D0SR63 at 2560x0
# (If left/right ever come out swapped, just switch the two positions below.)
monitor = desc:Dell Inc. DELL P2421DC J1VVS03, 2560x1440@59.95, 0x0, 1
monitor = desc:Dell Inc. DELL P2421DC 9D0SR63, 2560x1440@59.95, 2560x0, 1

# Pin the default workspace per panel by serial. Without this, Hyprland assigns
# workspaces by monitor enumeration ID (connector order), so the right panel
# grabbed workspace 1. default:true makes the left/main panel show workspace 1.
workspace = 1, monitor:desc:Dell Inc. DELL P2421DC J1VVS03, default:true
workspace = 2, monitor:desc:Dell Inc. DELL P2421DC 9D0SR63, default:true
